title = "Custom Secret Detection"

# Detect hardcoded passwords
[[rules]]
id = "hardcoded-password"
description = "Detect hardcoded passwords"
regex = '''(?i)\b(password|passwd|pwd|admin_password)\b\s*[:=]\s*["'][^"']{4,}["']'''
tags = ["password"]

# Detect API Keys, Tokens, Secrets
[[rules]]
id = "hardcoded-secret"
description = "Detect hardcoded secrets"
regex = '''(?i)\b(api_key|apikey|token|access_token|client_secret|secret|connection_string|sas_token|access_key|secret_key)\b\s*[:=]\s*["'][^"']{6,}["']'''
tags = ["secret"]

# Detect GitHub Personal Access Tokens
[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''gh[pousr]_[A-Za-z0-9_]{36,255}'''
tags = ["github"]

# Detect Azure Storage Connection String
[[rules]]
id = "azure-storage-connection-string"
description = "Azure Storage Connection String"
regex = '''DefaultEndpointsProtocol=https;AccountName=.*?;AccountKey=.*?;EndpointSuffix=.*'''
tags = ["azure"]

# Detect JWT Tokens
[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9._-]+\.[A-Za-z0-9._-]+'''
tags = ["jwt"]