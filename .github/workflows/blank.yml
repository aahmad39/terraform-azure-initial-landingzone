name: Terraform Sandbox Deployment

on:
  push:
    branches:
      - sandbox   # run pipeline when sandbox branch is updated
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.adnan }}

      - name: Terraform Init
        run: terraform init
        working-directory: ./Environment/sandbox

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./Environment/sandbox

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./Environment/sandbox

      - name: Terraform Apply
        if: github.ref == 'refs/heads/sandbox'
        run: terraform apply -auto-approve tfplan
        working-directory: ./Environment/sandbox
